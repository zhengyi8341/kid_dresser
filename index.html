<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toddler Dresser - Santa Clara</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { margin-top: 0; font-size: 24px; color: #2c3e50; }
        .weather-info {
            background: #eef2f7;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            font-size: 16px;
        }
        .clothing-box {
            background: #e3faf1;
            border: 2px solid #a3e9cf;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            text-align: left;
        }
        .clothing-item {
            margin: 10px 0;
            font-size: 18px;
        }
        .label { font-weight: bold; color: #16a085; }
        .loading { color: #7f8c8d; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <h1>👗 Toddler Dresser</h1>
    <div id="weather" class="loading">Fetching Santa Clara weather...</div>
    <div id="clothing"></div>
</div>

<script>
// Santa Clara, CA Coordinates
const LAT = 37.3541;
const LON = -121.9552;

async function getClothingSuggestion() {
    try {
        // Fetch current weather using the correct Open-Meteo v1/forecast endpoint
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,showers,snowfall,weather_code,cloud_cover,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`);
        
        // Check if the API actually sent a successful response
        if (!response.ok) {
            throw new Error(`API Error: ${response.status}`);
        }

        const data = await response.json();
        
        // Extract weather variables
        const temp = data.current.temperature_2m;
        const wind = data.current.wind_speed_10m;
        const clouds = data.current.cloud_cover; // Percentage 0-100

        // Determine descriptive strings for logic processing
        const windStatus = wind > 12 ? "Strong" : "Calm";
        const cloudStatus = clouds > 50 ? "Cloudy" : "Sunny";

        // Display current weather
        document.getElementById('weather').innerHTML = `
            <div class="weather-info">
                <strong>Santa Clara Weather Now:</strong><br>
                🌡️ ${Math.round(temp)}°F | 💨 Wind: ${windStatus} (${Math.round(wind)} mph) | ☁️ ${cloudStatus}
            </div>
        `;

        // Apply table logic
        let top = "";
        let bottoms = "";
        let shoes = "";

        if (temp > 80) {
            top = "Short sleeve"; bottoms = "Shorts"; shoes = "Sandals";
        } else if (temp >= 75 && temp <= 80) {
            if (windStatus === "Strong" || cloudStatus === "Cloudy") {
                top = "Short sleeve"; bottoms = "Thin long pants"; shoes = "Sandals";
            } else {
                top = "Short sleeve"; bottoms = "Shorts"; shoes = "Sandals";
            }
        } else if (temp >= 70 && temp < 75) {
            top = "Short sleeve"; bottoms = "Thin long pants"; shoes = "Sandals";
        } else if (temp >= 65 && temp < 70) {
            top = "Long sleeve OR Short sleeve + Vest"; bottoms = "Thin long pants"; shoes = "Sandals or Sneakers";
        } else if (temp >= 55 && temp < 65) {
            top = "Long sleeve + Medium Sweater/Hoodie"; bottoms = "Standard/Thick Long pants"; shoes = "Sneakers";
        } else { // < 55F
            top = "Long sleeve shirt + Vest + Thick jacket"; bottoms = "Thick winter pants"; shoes = "Sneakers";
        }

        // Display clothing result
        document.getElementById('clothing').innerHTML = `
            <div class="clothing-box">
                <div class="clothing-item"><span class="label">👕 Top:</span> ${top}</div>
                <div class="clothing-item"><span class="label">👖 Bottoms:</span> ${bottoms}</div>
                <div class="clothing-item"><span class="label">👟 Shoes:</span> ${shoes}</div>
            </div>
        `;

    } catch (error) {
        // Display the specific error message on the screen so it is easier to troubleshoot
        document.getElementById('weather').innerHTML = `<div style="color: red; padding: 10px;"><strong>Failed to load data:</strong><br>${error.message}</div>`;
        console.error("Full error details:", error);
    }
}

// Run immediately on page load
getClothingSuggestion();
</script>

</body>
</html>
