<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toddler Dresser - Santa Clara</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }
        h1 { margin-top: 0; font-size: 24px; color: #2c3e50; }
        .weather-info {
            background: #eef2f7;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            font-size: 15px;
            line-height: 1.5;
        }
        .clothing-box {
            background: #e3faf1;
            border: 2px solid #a3e9cf;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            text-align: left;
        }
        .clothing-item {
            margin: 12px 0;
            font-size: 16px;
            line-height: 1.4;
        }
        .label { font-weight: bold; color: #16a085; display: block; margin-bottom: 2px; }
        .loading { color: #7f8c8d; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <h1>👗 Toddler Dresser / 宝宝穿衣助手</h1>
    <div id="weather" class="loading">Fetching Santa Clara weather / 正在获取天气信息...</div>
    <div id="clothing"></div>
</div>

<script>
// Santa Clara, CA Coordinates
const LAT = 37.3541;
const LON = -121.9552;

async function getClothingSuggestion() {
    try {
        // Fetch current weather using the correct Open-Meteo v1/forecast endpoint
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,showers,snowfall,weather_code,cloud_cover,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`);
        
        if (!response.ok) {
            throw new Error(`API Error: ${response.status}`);
        }

        const data = await response.json();
        
        // Extract weather variables
        const temp = data.current.temperature_2m;
        const tempC = Math.round((temp - 32) * 5 / 9);
        const wind = data.current.wind_speed_10m;
        const clouds = data.current.cloud_cover; // Percentage 0-100

        // Determine descriptive strings for logic processing
        const isStrongWind = wind > 12;
        const isCloudy = clouds > 50;

        const windStatusEN = isStrongWind ? "Strong" : "Calm";
        const windStatusCN = isStrongWind ? "大" : "微风/无风";
        
        const cloudStatusEN = isCloudy ? "Cloudy" : "Sunny";
        const cloudStatusCN = isCloudy ? "阴天" : "晴天";

        // Display current weather in both languages
        document.getElementById('weather').innerHTML = `
            <div class="weather-info">
                <strong>Santa Clara Weather Now / 当前天气:</strong><br>
                🌡️ ${Math.round(temp)}°F (${tempC}°C)<br>
                💨 Wind / 风力: ${windStatusEN} / ${windStatusCN} (${Math.round(wind)} mph)<br>
                ☁️ Sky / 阴晴: ${cloudStatusEN} / ${cloudStatusCN}
            </div>
        `;

        // Apply table logic with dual language output
        let top = "";
        let bottoms = "";
        let shoes = "";

        if (temp > 80) {
            top = "Short sleeve / 短袖"; 
            bottoms = "Shorts / 短裤"; 
            shoes = "Sandals / 凉鞋";
        } else if (temp >= 75 && temp <= 80) {
            if (isStrongWind || isCloudy) {
                top = "Short sleeve / 短袖"; 
                bottoms = "Thin long pants / 薄长裤"; 
                shoes = "Sandals / 凉鞋";
            } else {
                top = "Short sleeve / 短袖"; 
                bottoms = "Shorts / 短裤"; 
                shoes = "Sandals / 凉鞋";
            }
        } else if (temp >= 70 && temp < 75) {
            top = "Short sleeve / 短袖"; 
            bottoms = "Thin long pants / 薄长裤"; 
            shoes = "Sandals / 凉鞋";
        } else if (temp >= 65 && temp < 70) {
            top = "Long sleeve OR Short sleeve + Vest / 长袖，或者短袖+马甲"; 
            bottoms = "Thin long pants / 薄长裤"; 
            shoes = "Sandals or Sneakers / 凉鞋或者运动鞋";
        } else if (temp >= 55 && temp < 65) {
            top = "Long sleeve + Medium Sweater/Hoodie / 长袖 + 中等厚度毛衣/卫衣"; 
            bottoms = "Standard or Thick Long pants / 普通或加厚长裤"; 
            shoes = "Sneakers / 运动鞋";
        } else { // < 55F
            top = "Long sleeve shirt + Vest + Thick jacket / 长袖衬衣+马甲+最厚运动服"; 
            bottoms = "Thick winter pants / 最厚裤子"; 
            shoes = "Sneakers / 运动鞋";
        }

        // Display clothing result with dual language labels
        document.getElementById('clothing').innerHTML = `
            <div class="clothing-box">
                <div class="clothing-item"><span class="label">👕 Top / 上衣:</span> ${top}</div>
                <div class="clothing-item"><span class="label">👖 Bottoms / 裤子:</span> ${bottoms}</div>
                <div class="clothing-item"><span class="label">👟 Shoes / 鞋子:</span> ${shoes}</div>
            </div>
        `;

    } catch (error) {
        document.getElementById('weather').innerHTML = `
            <div style="color: red; padding: 10px;">
                <strong>Failed to load data / 无法获取天气数据:</strong><br>${error.message}
            </div>`;
        console.error("Full error details:", error);
    }
}

// Run immediately on page load
getClothingSuggestion();
</script>

</body>
</html>
