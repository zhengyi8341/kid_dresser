<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toddler Dresser Weather</title>
    <!-- html2canvas library for capturing DOM elements -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e2e8f0;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .main-card {
            background: white;
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 { margin-top: 0; font-size: 24px; color: #1e293b; margin-bottom: 16px; }
        
        /* Location Tabs CSS */
        .location-tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #475569;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            background: #e2e8f0;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .current-time {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 25px;
        }
        .session-block {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            position: relative;
        }
        .session-block:last-child {
            margin-bottom: 0;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            border-left: 4px solid #3b82f6;
            padding-left: 10px;
        }
        .section-title-group {
            text-align: left;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #334155;
            margin: 0;
        }
        .section-subtitle {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
            font-weight: normal;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            margin-left: 10px;
        }
        .action-btn {
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .action-btn:active {
            transform: scale(0.96);
        }
        .save-btn {
            background-color: #10b981;
            color: white;
            box-shadow: 0 2px 5px rgba(16, 185, 129, 0.25);
        }
        .save-btn:hover {
            background-color: #059669;
        }
        .share-btn {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 2px 5px rgba(59, 130, 246, 0.25);
        }
        .share-btn:hover {
            background-color: #2563eb;
        }
        .weather-info {
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }
        .avg-weather {
            font-size: 15px;
        }
        .hourly-breakdown {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #cbd5e1;
            font-size: 13px;
            color: #475569;
        }
        .hourly-item {
            margin-bottom: 6px;
            background: #f8fafc;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .hourly-item:last-child {
            margin-bottom: 0;
        }
        .hourly-time {
            font-weight: bold;
            color: #0f172a;
            display: inline-block;
            width: 50px;
        }
        .clothing-box {
            background: #ecfdf5;
            border: 2px solid #10b981;
            padding: 18px 20px;
            border-radius: 12px;
            text-align: left;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.12);
        }
        .clothing-box-header {
            font-size: 13px;
            font-weight: bold;
            color: #047857;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            border-bottom: 2px solid #a7f3d0;
            padding-bottom: 6px;
        }
        .clothing-item {
            margin: 10px 0;
            font-size: 15px;
            line-height: 1.4;
        }
        .clothing-item:last-child {
            margin-bottom: 0;
        }
        .label { font-weight: bold; color: #047857; }
        .loading { color: #64748b; font-style: italic; padding: 20px; }
    </style>
</head>
<body>

<div class="main-card">
    <h1>👗 Toddler Dresser / 穿衣助手</h1>
    
    <!-- Location Toggle Tabs -->
    <div class="location-tabs">
        <button class="tab-btn active" data-key="santa_clara" onclick="switchLocation('santa_clara')">Santa Clara</button>
        <button class="tab-btn" data-key="los_altos" onclick="switchLocation('los_altos')">Los Altos (Mora Dr)</button>
    </div>

    <div id="time-display" class="current-time">Loading time...</div>

    <div id="app-content">
        <div class="loading">Fetching weather / 正在获取天气信息...</div>
    </div>
</div>

<script>
// --- Location Configurations ---
const LOCATIONS = {
    "santa_clara": { name: "Santa Clara", lat: 37.3541, lon: -121.9552 },
    "los_altos": { name: "Los Altos", lat: 37.3420, lon: -122.0860 } // Approx coordinates for 11311 Mora Dr
};
let currentLocKey = "santa_clara";

// --- Location Switcher ---
function switchLocation(key) {
    if (currentLocKey === key) return; // Ignore if already selected
    currentLocKey = key;
    
    // Update tab styles
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.key === key);
    });

    // Show loading state for the new location
    document.getElementById('app-content').innerHTML = `
        <div class="loading">Fetching ${LOCATIONS[key].name} weather / 正在获取天气信息...</div>
    `;
    
    // Fetch new weather data
    updateDresserApp();
}

// --- Helper to format date and day of week in both languages ---
function getBilingualDateInfo(dateObj) {
    const en = dateObj.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
    const zh = dateObj.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    return `${en} | ${zh}`;
}

// --- Helper to generate safe filename with Location and Timestamp ---
function generateFileName(titleText) {
    const locName = LOCATIONS[currentLocKey].name.replace(/\s+/g, '');
    const cleanTitle = titleText.split('/')[0].replace(/[^a-zA-Z0-9]/g, '-').trim();
    const laDate = new Date(new Date().toLocaleString("en-US", { timeZone: "America/Los_Angeles" }));
    
    let hours = laDate.getHours();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12; 
    
    const minutes = String(laDate.getMinutes()).padStart(2, '0');
    const month = String(laDate.getMonth() + 1).padStart(2, '0');
    const day = String(laDate.getDate()).padStart(2, '0');
    const year = laDate.getFullYear();
    
    const timestamp = `${year}-${month}-${day}_${hours}-${minutes}${ampm}`;
    return `Toddler-Dresser-${locName}-${cleanTitle}_${timestamp}.png`;
}

// --- Screen Capture Utility ---
async function captureBlockToBlob(blockId) {
    const element = document.getElementById(blockId);
    if (!element) return null;
    const canvas = await html2canvas(element, {
        scale: 2, 
        backgroundColor: '#f8fafc',
        useCORS: true
    });
    return new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
}

// --- Save Action: Directly Downloads the PNG ---
async function saveSection(blockId, titleText) {
    const element = document.getElementById(blockId);
    if (!element) return;
    const btn = element.querySelector('.save-btn');
    const originalText = btn.innerHTML;
    btn.innerHTML = '⏳...';

    try {
        const blob = await captureBlockToBlob(blockId);
        if (blob) {
            const fileName = generateFileName(titleText);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    } catch (err) {
        console.error("Save error:", err);
        alert("Failed to save image.");
    } finally {
        btn.innerHTML = originalText;
    }
}

// --- Share Action: Triggers Native Share Sheet ---
async function shareSection(blockId, titleText) {
    const element = document.getElementById(blockId);
    if (!element) return;
    const btn = element.querySelector('.share-btn');
    const originalText = btn.innerHTML;
    btn.innerHTML = '⏳...';

    try {
        const blob = await captureBlockToBlob(blockId);
        if (blob) {
            const fileName = generateFileName(titleText);
            const file = new File([blob], fileName, { type: 'image/png' });
            const locName = LOCATIONS[currentLocKey].name;

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: `Toddler Clothing Recommendation - ${locName}`,
                    text: `Here is the clothing recommendation for ${locName}!`
                });
            } else {
                alert("Native file sharing is not supported on this browser/device. Saving image instead...");
                await saveSection(blockId, titleText);
            }
        }
    } catch (err) {
        console.log('User cancelled share or share failed:', err);
    } finally {
        btn.innerHTML = originalText;
    }
}

// --- Temperature-to-clothing lookup matrix ---
function getClothingRecommendation(temp, windSpeed, cloudCover, targetDate) {
    const isStrongWind = windSpeed > 12;
    const isCloudy = cloudCover > 50;
    const month = targetDate.getMonth() + 1; 

    let top = ""; let bottoms = ""; let shoes = "";

    if (temp > 80) {
        top = "Short sleeve / 短袖"; 
        bottoms = "Shorts / 短裤"; 
        shoes = "Sandals / 凉鞋";
    } else if (temp >= 75 && temp <= 80) {
        if (isStrongWind || isCloudy) {
            top = "Short sleeve / 短袖"; bottoms = "Thin long pants / 薄长裤"; shoes = "Sandals / 凉鞋";
        } else {
            top = "Short sleeve / 短袖"; bottoms = "Shorts / 短裤"; shoes = "Sandals / 凉鞋";
        }
    } else if (temp >= 70 && temp < 75) {
        top = "Short sleeve / 短袖"; bottoms = "Thin long pants / 薄长裤"; shoes = "Sandals / 凉鞋";
    } else if (temp >= 65 && temp < 70) {
        if (month >= 6 && month <= 9) {
            top = "Short sleeve + Vest / 短袖+马甲"; bottoms = "Thin long pants / 薄长裤"; shoes = "Sandals + Socks / 凉鞋+袜子";
        } else if (month === 5 || month === 10) {
            top = "Long sleeve / 长袖"; bottoms = "Thin long pants / 薄长裤"; shoes = "Sneakers / 运动鞋";
        } else {
            top = "Long sleeve / 长袖"; bottoms = "Standard thickness long pants / 标准厚度长裤"; shoes = "Sneakers / 运动鞋";
        }
    } else if (temp >= 55 && temp < 65) {
        if (month >= 6 && month <= 9) {
            top = "Long sleeve + Vest / 长袖+马甲"; bottoms = "Thin long pants / 薄长裤"; shoes = "Sneakers / 运动鞋";
        } else {
            top = "Long sleeve shirt + Sports jacket / 长袖衬衣+运动服"; bottoms = "Medium thickness long pants / 中等厚度长裤"; shoes = "Sneakers / 运动鞋";
        }
    } else { // < 55F
        top = "Long sleeve shirt + Vest + Thick jacket / 长袖衬衣+马甲+最厚运动服"; bottoms = "Thick winter pants / 最厚裤子"; shoes = "Sneakers / 运动鞋";
    }

    return { top, bottoms, shoes };
}

// --- Helper Functions ---
function cToF(c) { return c * 9 / 5 + 32; }
function kmhToMph(k) { return k * 0.621371; }

function parseWindSpeedMph(str) {
    if (!str) return 0;
    const nums = (str.match(/\d+(\.\d+)?/g) || []).map(Number);
    if (nums.length === 0) return 0;
    return nums.reduce((a, b) => a + b, 0) / nums.length;
}

function cloudPercentFromLayers(cloudLayers) {
    if (!cloudLayers || cloudLayers.length === 0) return 0;
    const order = { SKC: 0, CLR: 0, FEW: 20, SCT: 45, BKN: 75, OVC: 100, VV: 100 };
    let maxPct = 0;
    cloudLayers.forEach(l => {
        if (l.amount in order) maxPct = Math.max(maxPct, order[l.amount]);
    });
    return maxPct;
}

function cloudPercentFromForecastText(text) {
    if (!text) return 30;
    const t = text.toLowerCase();
    if (t.includes('overcast')) return 100;
    if (t.includes('mostly cloudy')) return 75;
    if (t.includes('partly cloudy') || t.includes('partly sunny')) return 45;
    if (t.includes('mostly sunny') || t.includes('mostly clear')) return 20;
    if (t.includes('sunny') || t.includes('clear')) return 5;
    if (t.includes('cloudy')) return 75;
    if (t.includes('rain') || t.includes('shower') || t.includes('storm') || t.includes('drizzle') || t.includes('fog')) return 90;
    return 30;
}

function laDateOf(isoString) {
    return new Date(new Date(isoString).toLocaleString("en-US", { timeZone: "America/Los_Angeles" }));
}

function findHourlyPeriod(periods, targetDateStr, hour) {
    return periods.find(p => {
        const pla = laDateOf(p.startTime);
        return pla.toDateString() === targetDateStr && pla.getHours() === hour;
    });
}

function averagePeriods(periods) {
    let totalTemp = 0, totalWind = 0, totalClouds = 0;
    const hourlyDetails = [];

    periods.forEach(p => {
        const temp = p.temperature;
        const wind = parseWindSpeedMph(p.windSpeed);
        const clouds = cloudPercentFromForecastText(p.shortForecast);

        totalTemp += temp;
        totalWind += wind;
        totalClouds += clouds;

        const hourObj = laDateOf(p.startTime);
        const hourStr = hourObj.toLocaleTimeString('en-US', { hour: 'numeric', hour12: true });

        hourlyDetails.push({
            time: hourStr, temp: temp,
            windStatusEN: wind > 12 ? "Strong" : "Calm",
            windStatusCN: wind > 12 ? "大风" : "微/无风",
            cloudStatusEN: clouds > 50 ? "Cloudy" : "Sunny",
            cloudStatusCN: clouds > 50 ? "阴天" : "晴天"
        });
    });

    const n = periods.length;
    return { 
        temp: totalTemp / n, wind: totalWind / n, clouds: totalClouds / n, hourlyDetails: hourlyDetails
    };
}

function generateHTMLBlock(blockId, title, subtitle, temp, wind, clouds, rec, hourlyDetails = []) {
    const tempC = Math.round((temp - 32) * 5 / 9);
    const windStatusEN = wind > 12 ? "Strong" : "Calm";
    const windStatusCN = wind > 12 ? "大风" : "微/无风";
    const cloudStatusEN = clouds > 50 ? "Cloudy" : "Sunny";
    const cloudStatusCN = clouds > 50 ? "阴天" : "晴天";

    let hourlyHTML = "";
    if (hourlyDetails && hourlyDetails.length > 0) {
        hourlyHTML = `<div class="hourly-breakdown">`;
        hourlyDetails.forEach(detail => {
            hourlyHTML += `
                <div class="hourly-item">
                    <span class="hourly-time">${detail.time}</span> | 🌡️ ${Math.round(detail.temp)}°F | 💨 ${detail.windStatusEN}/${detail.windStatusCN} | ☁️ ${detail.cloudStatusEN}/${detail.cloudStatusCN}
                </div>`;
        });
        hourlyHTML += `</div>`;
    }

    return `
        <div class="session-block" id="${blockId}">
            <div class="section-header">
                <div class="section-title-group">
                    <div class="section-title">${title}</div>
                    <div class="section-subtitle">${subtitle}</div>
                </div>
                <div class="btn-group" data-html2canvas-ignore>
                    <button class="action-btn save-btn" onclick="saveSection('${blockId}', '${title}')">
                        💾 Save
                    </button>
                    <button class="action-btn share-btn" onclick="shareSection('${blockId}', '${title}')">
                        📤 Share
                    </button>
                </div>
            </div>
            
            <div class="weather-info">
                <div class="avg-weather">
                    <strong>Average / 平均气象:</strong><br>
                    🌡️ ${Math.round(temp)}°F (${tempC}°C) | 💨 ${windStatusEN}/${windStatusCN} | ☁️ ${cloudStatusEN}/${cloudStatusCN}
                </div>
                ${hourlyHTML}
            </div>
            
            <div class="clothing-box">
                <div class="clothing-box-header">✨ Recommendation / 推荐穿搭</div>
                <div class="clothing-item"><span class="label">👕 上衣 / Top:</span> ${rec.top}</div>
                <div class="clothing-item"><span class="label">👖 裤子 / Bottoms:</span> ${rec.bottoms}</div>
                <div class="clothing-item"><span class="label">👟 鞋子 / Shoes:</span> ${rec.shoes}</div>
            </div>
        </div>
    `;
}

async function updateDresserApp() {
    try {
        const loc = LOCATIONS[currentLocKey]; // Get the currently selected location
        const laTimeString = new Date().toLocaleString("en-US", { timeZone: "America/Los_Angeles" });
        const laDate = new Date(laTimeString);

        const timeOptions = { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true };
        document.getElementById('time-display').innerHTML = `
            Current Time / 当前时间:<br><strong>${laDate.toLocaleString('en-US', timeOptions)} (CA)</strong>
        `;

        // Fetch based on active coordinates
        const pointsResp = await fetch(`https://api.weather.gov/points/${loc.lat},${loc.lon}`);
        if (!pointsResp.ok) throw new Error(`NWS points API error: ${pointsResp.status}`);
        const pointsData = await pointsResp.json();
        const forecastHourlyUrl = pointsData.properties.forecastHourly;
        const stationsUrl = pointsData.properties.observationStations;

        const hourlyResp = await fetch(forecastHourlyUrl);
        if (!hourlyResp.ok) throw new Error(`NWS hourly forecast error: ${hourlyResp.status}`);
        const hourlyData = await hourlyResp.json();
        const periods = hourlyData.properties.periods;

        let curTemp = null, curWind = null, curClouds = null;
        try {
            const stationsResp = await fetch(stationsUrl);
            const stationsData = await stationsResp.json();
            const stationId = stationsData.features[0].properties.stationIdentifier;
            const obsResp = await fetch(`https://api.weather.gov/stations/${stationId}/observations/latest`);
            const obsData = await obsResp.json();
            const obsProps = obsData.properties;
            if (obsProps.temperature && obsProps.temperature.value !== null) {
                curTemp = cToF(obsProps.temperature.value);
                curWind = (obsProps.windSpeed && obsProps.windSpeed.value !== null) ? kmhToMph(obsProps.windSpeed.value) : 0;
                curClouds = cloudPercentFromLayers(obsProps.cloudLayers);
            }
        } catch (e) {}

        if (curTemp === null) {
            const p0 = periods[0];
            curTemp = p0.temperature;
            curWind = parseWindSpeedMph(p0.windSpeed);
            curClouds = cloudPercentFromForecastText(p0.shortForecast);
        }

        const curDateInfo = getBilingualDateInfo(laDate);
        const curRec = getClothingRecommendation(curTemp, curWind, curClouds, laDate);
        let finalHTML = generateHTMLBlock("block-current", "Right Now / 当前", curDateInfo, curTemp, curWind, curClouds, curRec);

        const currentHour = laDate.getHours();
        const todayStr = laDate.toDateString();
        const tomorrowDate = new Date(laDate);
        tomorrowDate.setDate(tomorrowDate.getDate() + 1);
        const tomorrowStr = tomorrowDate.toDateString();

        let session1, session2;
        if (currentHour < 9) {
            session1 = { id: "block-session1", label: "Next: Today Morning / 今天上午", dateStr: todayStr, hours: [9, 10] };
            session2 = { id: "block-session2", label: "Then: Today Afternoon / 今天下午", dateStr: todayStr, hours: [16, 17] };
        } else if (currentHour < 16) {
            session1 = { id: "block-session1", label: "Next: Today Afternoon / 今天下午", dateStr: todayStr, hours: [16, 17] };
            session2 = { id: "block-session2", label: "Then: Tomorrow Morning / 明天上午", dateStr: tomorrowStr, hours: [9, 10] };
        } else {
            session1 = { id: "block-session1", label: "Next: Tomorrow Morning / 明天上午", dateStr: tomorrowStr, hours: [9, 10] };
            session2 = { id: "block-session2", label: "Then: Tomorrow Afternoon / 明天下午", dateStr: tomorrowStr, hours: [16, 17] };
        }

        [session1, session2].forEach(session => {
            const matched = session.hours
                .map(h => findHourlyPeriod(periods, session.dateStr, h))
                .filter(Boolean);

            const sessionDate = new Date(session.dateStr);
            const sessionDateInfo = getBilingualDateInfo(sessionDate);

            if (matched.length === 0) {
                finalHTML += `
                    <div class="session-block" id="${session.id}">
                        <div class="section-header">
                            <div class="section-title-group">
                                <div class="section-title">${session.label}</div>
                                <div class="section-subtitle">${sessionDateInfo}</div>
                            </div>
                        </div>
                        <div class="weather-info">Forecast data not yet available for this window / 该时段暂无预报数据</div>
                    </div>
                `;
                return;
            }

            const avg = averagePeriods(matched);
            const rec = getClothingRecommendation(avg.temp, avg.wind, avg.clouds, sessionDate);
            
            finalHTML += generateHTMLBlock(session.id, session.label, sessionDateInfo, avg.temp, avg.wind, avg.clouds, rec, avg.hourlyDetails);
        });

        document.getElementById('app-content').innerHTML = finalHTML;

    } catch (error) {
        document.getElementById('app-content').innerHTML = `
            <div style="color: red; padding: 20px;">
                <strong>Failed to load data / 无法获取天气数据:</strong><br>${error.message}
            </div>`;
    }
}

// Initial Load
updateDresserApp();
</script>

</body>
</html>
